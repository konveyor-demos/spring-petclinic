      title: org.springframework.boot.webmvc.test.autoconfigure (API)
  when:
    java.referenced:
      pattern: org.springframework.boot.test.autoconfigure.web.servlet.AutoConfigureMockMvc
      location: ANNOTATION
- ruleID: test-slices-00030

- ruleID: test-slices-00010
  description: "@WebMvcTest moved to the spring-boot-webmvc-test module"
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=spring-boot3
    - konveyor.io/source=spring-boot
    - konveyor.io/target=spring-boot4
    - konveyor.io/target=spring-boot
  message: |-
    Spring Boot 4 splits the test auto-configuration into technology-specific modules.
    `@WebMvcTest` moved from `org.springframework.boot.test.autoconfigure.web.servlet`
    to `org.springframework.boot.webmvc.test.autoconfigure`.

    ### Before

    ```java
    import org.springframework.boot.test.autoconfigure.web.servlet.WebMvcTest;
    ```

    ### After

    ```java
    import org.springframework.boot.webmvc.test.autoconfigure.WebMvcTest;
    ```

    Add the matching test starter to the build:

    ```xml
    <dependency>
      <groupId>org.springframework.boot</groupId>
      <artifactId>spring-boot-starter-webmvc-test</artifactId>
      <scope>test</scope>
    </dependency>
    ```
  links:
    - url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
      title: Spring Boot 4.0 Migration Guide
    - url: https://docs.spring.io/spring-boot/api/java/org/springframework/boot/webmvc/test/autoconfigure/package-summary.html
      title: org.springframework.boot.webmvc.test.autoconfigure (API)
  when:
    java.referenced:
      pattern: org.springframework.boot.test.autoconfigure.web.servlet.WebMvcTest
      location: ANNOTATION
- ruleID: test-slices-00020
